name: Inspect Android build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS-Build-ID oder latest für den aktuellen Build'
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read EAS failure details
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          node --input-type=module - <<'JS'
          const latest=process.env.BUILD_ID==='latest';
          const query=latest?'query { app { byId(appId: "e7b64112-a16d-4eb0-b3b8-34a887741587") { builds(offset: 0, limit: 1) { id status error { errorCode message } logFiles } } } }':'query BuildFailure($id: ID!) { builds { byId(buildId: $id) { id status error { errorCode message } logFiles } } }';
          const response=await fetch('https://api.expo.dev/graphql',{method:'POST',headers:{'Content-Type':'application/json',Authorization:`Bearer ${process.env.EXPO_TOKEN}`},body:JSON.stringify({query,variables:latest?{}:{id:process.env.BUILD_ID}})});
          const result=await response.json();
          if(result.errors)throw Error(JSON.stringify(result.errors));
          const build=latest?result.data.app.byId.builds[0]:result.data.builds.byId;
          console.log(JSON.stringify({id:build.id,status:build.status,error:build.error}));
          for(const url of build.logFiles||[]){
            const log=await (await fetch(url)).text();
            const messages=log.trim().split('\n').map(line=>{try{return JSON.parse(line).msg||line;}catch{return line;}});
            const relevant=messages.filter(line=>/error|fail|cannot|unsupported|not found|exception|warning/i.test(line));
            for(const line of relevant.length?relevant:messages.slice(-6))console.log(line);
          }
          JS
