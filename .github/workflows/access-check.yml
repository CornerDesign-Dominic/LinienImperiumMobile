name: Check Expo and Firebase access
on:
  push:
    branches: [main]
    paths: [.github/workflows/access-check.yml]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: google-github-actions/auth@v3
        with:
          project_id: linienimperium
          workload_identity_provider: projects/350521926986/locations/global/workloadIdentityPools/linienimperium-github/providers/mobile-main
          service_account: github-mobile-deploy@linienimperium.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - name: Read Firestore configuration
        run: gcloud firestore databases describe --database='(default)' --project=linienimperium --format='value(locationId)'
      - name: Check Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN"
          npx --yes eas-cli@latest whoami
